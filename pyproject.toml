[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "running-exporter"
version = "0.1.0"
description = "Exporta las detecciones de Kafka alrededor de un timestamp a imágenes anotadas"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3",
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
running-exporter = "exporter.main:main"

[tool.setuptools.packages.find]
include = ["exporter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
